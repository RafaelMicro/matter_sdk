            #   run: python3 scripts/workflow/create_issue.py "${{ github.token }}" "${{github.repository_owner}}" "${{github.repository}}"

            # - name: Create an issue
            #   uses: dacbd/create-issue-action@main
            #   with:
            #     token: ${{ github.token }}
            #     title: Simple test issue
            #     body: my new issue
            #     assignees: eling22

