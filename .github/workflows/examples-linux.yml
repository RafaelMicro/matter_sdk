# This is a basic workflow to help you get started with Actions

name: Build example - Linux 

on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  merge_group:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
    group: ${{ github.ref }}-${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.number) || (github.event_name == 'workflow_dispatch' && github.run_number) || github.sha }}
    cancel-in-progress: true

env:
    CHIP_NO_LOG_TIMESTAMPS: true
    UPLOAD_FOLDER: tmp
    SIZE_FOLDER: size_reports
    BIN_FOLDER: bin_files
    
jobs:
    build-linux:
        name: Build-Linux

        runs-on: ubuntu-latest
        if: github.actor != 'restyled-io[bot]'

        container:
            image: ghcr.io/project-chip/chip-build:119

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Checkout submodules & Bootstrap
              uses: ./.github/actions/checkout-submodules-and-bootstrap
              with:
                platform: linux

            - name: Set up upload folder
              run : |
                mkdir -p $UPLOAD_FOLDER/$BIN_FOLDER
                mkdir -p $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build contact-sensor-app example
              id: build_contact_sensor_app
              continue-on-error: true
              uses: ./.github/actions/build-example
              with:
                example_name: contact-sensor-app
                chip_name: RT583
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build humidity-sensor-app example
              id: build_humidity_sensor_app
              continue-on-error: true
              uses: ./.github/actions/build-example
              with:
                example_name: humidity-sensor-app
                chip_name: RT584H
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build light-switch-app example
              id: build_light_switch_app
              continue-on-error: true
              uses: ./.github/actions/build-example
              with:
                example_name: light-switch-app
                chip_name: RT584L
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build lighting-app example
              id: build_lighting_app
              continue-on-error: true
              uses: ./.github/actions/build-example
              with:
                example_name: lighting-app
                chip_name: RT584HA4
                opt_arg: --sed=no --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build lighting-zigbee example
              id: build_lighting_zigbee
              continue-on-error: true
              uses: ./.github/actions/build-example
              with:
                example_name: lighting-zigbee
                chip_name: RT584HA4
                opt_arg: --sed=no --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build lock-app example
              id: build_lock_app
              continue-on-error: true
              uses: ./.github/actions/build-example
              with:
                example_name: lock-app
                chip_name: RT583
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build occupancy-sensor-app example
              id: build_occupancy_sensor_app
              continue-on-error: true
              uses: ./.github/actions/build-example
              with:
                example_name: occupancy-sensor-app
                chip_name: RT584H
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build smart-plug-app example
              id: build_smart_plug_app
              continue-on-error: true
              uses: ./.github/actions/build-example
              with:
                example_name: smart-plug-app
                chip_name: RT584L
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build smoke-alarm-app example
              id: build_smoke_alarm_app
              continue-on-error: true
              uses: ./.github/actions/build-example
              with:
                example_name: smoke-alarm-app
                chip_name: RT584HA4
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build temperature-measurement-app example
              id: build_temperature_measurement_app
              continue-on-error: true
              uses: ./.github/actions/build-example
              with:
                example_name: temperature-measurement-app
                chip_name: RT583
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build thermostat example
              id: build_thermostat
              continue-on-error: true
              uses: ./.github/actions/build-example
              with:
                example_name: thermostat
                chip_name: RT584H
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build water-valve-app example
              id: build_water_valve_app
              continue-on-error: true
              uses: ./.github/actions/build-example
              with:
                example_name: water-valve-app
                chip_name: RT584L
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build window-app example
              id: build_window_app
              continue-on-error: true
              uses: ./.github/actions/build-example
              with:
                example_name: window-app
                chip_name: RT584HA4
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Check all example builds succeeded
              if: always()
              env:
                contact_sensor_app: ${{ steps.build_contact_sensor_app.outcome }}
                humidity_sensor_app: ${{ steps.build_humidity_sensor_app.outcome }}
                light_switch_app: ${{ steps.build_light_switch_app.outcome }}
                lighting_app: ${{ steps.build_lighting_app.outcome }}
                lighting_zigbee: ${{ steps.build_lighting_zigbee.outcome }}
                lock_app: ${{ steps.build_lock_app.outcome }}
                occupancy_sensor_app: ${{ steps.build_occupancy_sensor_app.outcome }}
                smart_plug_app: ${{ steps.build_smart_plug_app.outcome }}
                smoke_alarm_app: ${{ steps.build_smoke_alarm_app.outcome }}
                temperature_measurement_app: ${{ steps.build_temperature_measurement_app.outcome }}
                thermostat: ${{ steps.build_thermostat.outcome }}
                water_valve_app: ${{ steps.build_water_valve_app.outcome }}
                window_app: ${{ steps.build_window_app.outcome }}
              run: |
                failed=0
                for name in contact_sensor_app humidity_sensor_app light_switch_app lighting_app lighting_zigbee lock_app occupancy_sensor_app smart_plug_app smoke_alarm_app temperature_measurement_app thermostat water_valve_app window_app; do
                  outcome="${!name}"
                  echo "$name: $outcome"
                  if [ "$outcome" != "success" ]; then
                    failed=1
                  fi
                done
                if [ "$failed" -eq 1 ]; then
                  echo "One or more example builds failed"
                  exit 1
                fi

            - name: Clean out build output
              if: always()
              run: rm -rf ./out

            - name: Uploading Files
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                name: bin_files_and_size_files
                path: ${{ env.UPLOAD_FOLDER }}/

            # Either the following steps can create an issue
            
            # - name: Create an issue
            #   run: python3 scripts/workflow/create_issue.py "${{ github.token }}" "${{github.repository_owner}}" "${{github.repository}}"

            # - name: Create an issue
            #   uses: dacbd/create-issue-action@main
            #   with:
            #     token: ${{ github.token }}
            #     title: Simple test issue
            #     body: my new issue
            #     assignees: eling22

