# This is a basic workflow to help you get started with Actions

name: Build example - Linux 

on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  merge_group:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
    group: ${{ github.ref }}-${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.number) || (github.event_name == 'workflow_dispatch' && github.run_number) || github.sha }}
    cancel-in-progress: true

env:
    CHIP_NO_LOG_TIMESTAMPS: true
    UPLOAD_FOLDER: tmp
    SIZE_FOLDER: size_reports
    BIN_FOLDER: bin_files
    
jobs:
    build-linux:
        name: Build-Linux

        runs-on: ubuntu-latest
        if: github.actor != 'restyled-io[bot]'

        container:
            image: ghcr.io/project-chip/chip-build:119

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Checkout submodules & Bootstrap
              uses: ./.github/actions/checkout-submodules-and-bootstrap
              with:
                platform: linux

            - name: Set up upload folder
              run : |
                mkdir -p $UPLOAD_FOLDER/$BIN_FOLDER
                mkdir -p $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build contact-sensor-app example
              uses: ./.github/actions/build-example
              with:
                example_name: contact-sensor-app
                chip_name: RT583
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build humidity-sensor-app example
              uses: ./.github/actions/build-example
              with:
                example_name: humidity-sensor-app
                chip_name: RT584H
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build light-switch-app example
              uses: ./.github/actions/build-example
              with:
                example_name: light-switch-app
                chip_name: RT584L
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build lighting-app example
              uses: ./.github/actions/build-example
              with:
                example_name: lighting-app
                chip_name: RT584HA4
                opt_arg: --sed=no --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build lighting-zigbee example
              uses: ./.github/actions/build-example
              with:
                example_name: lighting-zigbee
                chip_name: RT584HA4
                opt_arg: --sed=no --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build lock-app example
              uses: ./.github/actions/build-example
              with:
                example_name: lock-app
                chip_name: RT583
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build occupancy-sensor-app example
              uses: ./.github/actions/build-example
              with:
                example_name: occupancy-sensor-app
                chip_name: RT584H
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build smart-plug-app example
              uses: ./.github/actions/build-example
              with:
                example_name: smart-plug-app
                chip_name: RT584L
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build smoke-alarm-app example
              uses: ./.github/actions/build-example
              with:
                example_name: smoke-alarm-app
                chip_name: RT584HA4
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build temperature-measurement-app example
              uses: ./.github/actions/build-example
              with:
                example_name: temperature-measurement-app
                chip_name: RT583
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build thermostat example
              uses: ./.github/actions/build-example
              with:
                example_name: thermostat
                chip_name: RT584H
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build water-valve-app example
              uses: ./.github/actions/build-example
              with:
                example_name: water-valve-app
                chip_name: RT584L
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Build window-app example
              uses: ./.github/actions/build-example
              with:
                example_name: window-app
                chip_name: RT584HA4
                opt_arg: --sed=yes --ota=yes --certs=yes
                upload_bin_path: $UPLOAD_FOLDER/$BIN_FOLDER
                upload_size_path: $UPLOAD_FOLDER/$SIZE_FOLDER

            - name: Clean out build output
              run: rm -rf ./out

            - name: Uploading Files
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                name: bin_files_and_size_files
                path: ${{ env.UPLOAD_FOLDER }}/

            # Either the following steps can create an issue
            
